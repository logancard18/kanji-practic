<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Japanese Kanji Flashcards — 3 Sets (Responsive)</title>
<style>
  :root{
    --bg:#f7f7fb; --card:#ffffff; --accent:#2b6cb0; --muted:#666;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:var(--bg); color:#111;}
  .app{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .container{width:100%; max-width:900px; background:transparent;}
  header{display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap;}
  header h1{margin:0; font-size:18px;}
  .controls{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  select, button{padding:8px 12px; border-radius:8px; border:1px solid #ddd; background:#fff; cursor:pointer;}
  button{min-width:90px;}
  .card-wrap{background:var(--card); border-radius:12px; padding:20px; box-shadow:0 6px 18px rgba(20,20,50,0.06);}
  .card{
    min-height:220px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  }
  .card .title{font-size:14px; color:var(--muted);}
  .kanji{font-weight:700; font-size:72px; text-align:center; word-break:break-word;}
  .hiragana{font-size:36px; text-align:center; word-break:break-word;}
  .meaning{font-size:20px; color:#333; text-align:center; max-width:100%; word-break:break-word;}
  .romaji{font-size:18px; color:var(--muted); text-align:center;}
  .nav{display:flex; gap:8px; justify-content:center; margin-top:16px; flex-wrap:wrap;}
  .small{font-size:13px; padding:6px 10px; min-width:70px;}
  .status{margin-top:12px; text-align:center; color:var(--muted); font-size:13px;}
  @media (max-width:520px){
    .kanji{font-size:48px}
    .hiragana{font-size:26px}
    .meaning{font-size:16px}
  }
  /* overlay for "End of list" */
  .overlay{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;
  }
  .bubble{
    pointer-events:auto;
    background:rgba(255,255,255,0.98);
    border:1px solid #ddd;
    padding:18px 20px; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,0.08);
    font-weight:600; color:#222;
  }
</style>
</head>
<body>
<div class="app">
  <div class="container">
    <header>
      <h1>টুটুল এর কাল পাসা</h1>
      <h1>Japanese Flashcards (Kanji → reveal Hiragana → Meaning → Romaji)</h1>
      <div class="controls">
        <label for="setSelect">Set:</label>
        <select id="setSelect" aria-label="Select dataset">
          <option value="set1">Set 1 (numbers, days...)</option>
          <option value="set2">Set 2 (students, time, travel...)</option>
          <option value="set3">Set 3 (verbs, adjectives, daily words)</option>
        </select>
        <button id="restartBtn" class="small">Restart</button>
      </div>
    </header>

    <div class="card-wrap">
      <div class="card" id="card">
        <div class="title" id="cardTitle">Kanji</div>
        <div class="kanji" id="kanjiField">&nbsp;</div>
        <div class="hiragana" id="hiraganaField" style="display:none">&nbsp;</div>
        <div class="meaning" id="meaningField" style="display:none">&nbsp;</div>
        <div class="romaji" id="romajiField" style="display:none">&nbsp;</div>
      </div>

      <div class="nav">
        <button id="prevBtn" class="small">Previous</button>
        <button id="revealBtn" class="small">Reveal</button>
        <button id="showKanjiBtn" class="small">Show Kanji</button>
        <button id="nextBtn" class="small">Next</button>
      </div>

      <div class="status" id="statusText">Card 0 / 0</div>
    </div>
  </div>
</div>

<div id="overlay" class="overlay" style="display:none">
  <div class="bubble" id="overlayText">End of list! Shuffling again...</div>
</div>

  { kanji:"認識します", hiragana:"にんしきします", romaji:"ninshiki shimasu", meaning:"to recognize / awareness" },
  { kanji:"日常", hiragana:"にちじょう", romaji:"nichijou", meaning:"daily life" },
  { kanji:"日用品", hiragana:"にちようひん", romaji:"nichiyouhin", meaning:"daily necessities" },
  { kanji:"魚", hiragana:"さかな", romaji:"sakana", meaning:"fish" },
  { kanji:"魚屋", hiragana:"さかなや", romaji:"sakanaya", meaning:"fish shop" },
  { kanji:"耳", hiragana:"みみ", romaji:"mimi", meaning:"ear" },
  { kanji:"銀", hiragana:"ぎん", romaji:"gin", meaning:"silver" },
  { kanji:"銀行", hiragana:"ぎんこう", romaji:"ginkou", meaning:"bank" },
  { kanji:"道", hiragana:"みち", romaji:"michi", meaning:"road / way" },
  { kanji:"水道", hiragana:"すいどう", romaji:"suidou", meaning:"water supply / tap water" },
  { kanji:"雨季", hiragana:"うき", romaji:"uki", meaning:"rainy season" },
  { kanji:"道具", hiragana:"どうぐ", romaji:"dougu", meaning:"tool / equipment" },
  { kanji:"作ります", hiragana:"つくります", romaji:"tsukurimasu", meaning:"to make" },
  { kanji:"作文", hiragana:"さくぶん", romaji:"sakubun", meaning:"composition / essay" },
  { kanji:"使います", hiragana:"つかいます", romaji:"tsukaimasu", meaning:"to use" },
  { kanji:"大使館", hiragana:"たいしかん", romaji:"taishikan", meaning:"embassy" },
  { kanji:"待ちます", hiragana:"まちます", romaji:"machimasu", meaning:"to wait" },
  { kanji:"近い", hiragana:"ちかい", romaji:"chikai", meaning:"near / close" },
  { kanji:"乗り換え", hiragana:"のりかえ", romaji:"norikae", meaning:"transfer (trains/buses)" },
  { kanji:"不便", hiragana:"ふべん", romaji:"fuben", meaning:"inconvenient" },
  { kanji:"心", hiragana:"こころ", romaji:"kokoro", meaning:"heart / mind" },
  { kanji:"心配します", hiragana:"しんぱいします", romaji:"shinpai shimasu", meaning:"to worry" },
  { kanji:"発進", hiragana:"はっしん", romaji:"hasshin", meaning:"departure / starting (vehicle)" }
];

/* ---------------------------
   Utility functions
   --------------------------- */

function shuffleArray(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
}

/* App State */
let activeSet = "set1";
let deck = [];
let index = 0;
let revealStage = 0; // 0 = only kanji (front), 1 = show hiragana, 2 = show meaning, 3 = show romaji
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');

/* DOM */
const setSelect = document.getElementById('setSelect');
const kanjiField = document.getElementById('kanjiField');
const hiraganaField = document.getElementById('hiraganaField');
const meaningField = document.getElementById('meaningField');
const romajiField = document.getElementById('romajiField');
const cardTitle = document.getElementById('cardTitle');
const statusText = document.getElementById('statusText');

const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const revealBtn = document.getElementById('revealBtn');
const showKanjiBtn = document.getElementById('showKanjiBtn');
const restartBtn = document.getElementById('restartBtn');

/* Initialize */
function loadSet(name){
  activeSet = name;
  if(name === "set1") deck = JSON.parse(JSON.stringify(set1));
  else if(name === "set2") deck = JSON.parse(JSON.stringify(set2));
  else deck = JSON.parse(JSON.stringify(set3));

  shuffleArray(deck);
  index = 0;
  revealStage = 0;
  updateUI();
}

function updateUI(){
  if(deck.length === 0){
    kanjiField.textContent = "";
    hiraganaField.style.display = "none";
    meaningField.style.display = "none";
    romajiField.style.display = "none";
    statusText.textContent = "No cards in this set.";
    return;
  }
  const card = deck[index];
  // set kanji always visible
  kanjiField.textContent = card.kanji || card.hiragana || "—";
  // hide other reveals by default
  hiraganaField.style.display = "none";
  meaningField.style.display = "none";
  romajiField.style.display = "none";

  cardTitle.textContent = "Kanji";
  statusText.textContent = `Card ${index+1} / ${deck.length}`;

  // If reveal stage already progressed (e.g., after next/back), show appropriate items
  if(revealStage >= 1){
    hiraganaField.style.display = "";
    hiraganaField.textContent = card.hiragana || "—";
  }
  if(revealStage >= 2){
    meaningField.style.display = "";
    meaningField.textContent = card.meaning && card.meaning.trim() !== "" ? card.meaning : `Kanji: ${card.kanji || "—"}`;
  }
  if(revealStage >= 3){
    romajiField.style.display = "";
    romajiField.textContent = card.romaji || "—";
  }
}

function revealNext(){
  if(deck.length === 0) return;
  if(revealStage < 3){
    revealStage++;
    // update title to reflect the reveal stage
    if(revealStage === 1) cardTitle.textContent = "Hiragana";
    else if(revealStage === 2) cardTitle.textContent = "Meaning";
    else if(revealStage === 3) cardTitle.textContent = "Romaji";
    updateUI();
  } else {
    // already fully revealed; do nothing or optionally move next
  }
}

function showKanji(){
  revealStage = 0;
  cardTitle.textContent = "Kanji";
  updateUI();
}

/* navigation */
function nextCard(skipShuffleAtEnd=false){
  if(deck.length === 0) return;
  index++;
  if(index >= deck.length){
    // end of list
    // show overlay, then reshuffle and restart after 2s
    overlayText.textContent = "End of list! Shuffling again...";
    overlay.style.display = "";
    setTimeout(()=>{
      overlay.style.display = "none";
      shuffleArray(deck);
      index = 0;
      revealStage = 0;
      updateUI();
    }, 2000);
  } else {
    revealStage = 0;
    updateUI();
  }
}

function prevCard(){
  if(deck.length === 0) return;
  index--;
  if(index < 0) index = deck.length - 1;
  revealStage = 0;
  updateUI();
}

function restartDeck(){
  if(deck.length === 0) return;
  shuffleArray(deck);
  index = 0;
  revealStage = 0;
  updateUI();
}

/* events */
setSelect.addEventListener('change', ()=>{ loadSet(setSelect.value); });
revealBtn.addEventListener('click', revealNext);
showKanjiBtn.addEventListener('click', showKanji);
nextBtn.addEventListener('click', ()=> nextCard());
prevBtn.addEventListener('click', prevCard);
restartBtn.addEventListener('click', restartDeck);

/* keyboard shortcuts */
document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') nextCard();
  else if(e.key === 'ArrowLeft') prevCard();
  else if(e.key.toLowerCase() === 'r') restartDeck();
  else if(e.key === ' ') { e.preventDefault(); revealNext(); }
});

/* Start with set1 */
loadSet('set1');

/* Responsive trick: ensure reveal fields wrap nicely by adjusting sizes in CSS; nothing else needed */
</script>
</body>
</html>
